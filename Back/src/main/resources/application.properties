spring.application.name=RE-WEAR
logging.level.org.springframework.security=INFO

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

rewear.admin.username=${REWEAR_ADMIN_USERNAME}
rewear.admin.password=${REWEAR_ADMIN_PASSWORD}
rewear.admin.email=${REWEAR_ADMIN_EMAIL}
rewear.admin.phone=${REWEAR_ADMIN_PHONE}

# 기본 사용자 계정 설정
rewear.user.username=${REWEAR_USER_USERNAME}
rewear.user.password=${REWEAR_USER_PASSWORD}

# 기본 기관 계정 설정
rewear.organ.username=${REWEAR_ORGAN_USERNAME}
rewear.organ.password=${REWEAR_ORGAN_PASSWORD}
rewear.organ.business-no=${REWEAR_ORGAN_BUSINESS_NO}
rewear.organ.org-name=${REWEAR_ORGAN_NAME}
rewear.organ.auto-approve=${REWEAR_ORGAN_AUTO_APPROVE:false}

# --- MySQL Database 설정 ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=info
logging.level.org.thymeleaf=INFO
logging.level.org.springframework.web=INFO

# 로그 파일 저장 설정 (비활성화)
# logging.file.name=logs/application.log
# logging.file.max-size=10MB
# logging.file.max-history=30

# 파일 업로드 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 업로드 디렉토리 (프로젝트 루트 기준)
app.upload.dir=uploads
rewear.admin.reset-password=${REWEAR_ADMIN_RESET_PASSWORD:false}
rewear.user.reset-password=${REWEAR_USER_RESET_PASSWORD:false}
rewear.organ.reset-password=${REWEAR_ORGAN_RESET_PASSWORD:false}

server.error.include-message=never
server.error.include-binding-errors=never
